name: Run tests of omataxonomy

on:
  push:
    branches:
      - main 
  pull_request:
    branches:
      - main

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
        resolution: ["locked", "highest", "lowest-direct"]

    name: py${{ matrix.python-version }} (${{ matrix.resolution }})
    steps:
    - uses: actions/checkout@v7
    - name: Set up uv with Python ${{ matrix.python-version }}
      uses: astral-sh/setup-uv@v10.3.0
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies for package
      run: |
        if [ "${{ matrix.resolution }}" = "locked" ]; then
          uv sync --locked
        else
          uv sync --upgrade --resolution ${{ matrix.resolution }}
        fi

    - name: Test with pytest
      run: |
        uv run pytest
