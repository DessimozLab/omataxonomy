# This workflow builds the package with uv and publishes it to PyPI when a v* tag is pushed.
# It uses PyPI trusted publishing (OIDC), so no API token is needed. The trusted publisher
# must be configured on PyPI for this repository and workflow file.

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Upload omataxonomy to pypi

on:
  push:
    tags:
      - v*

jobs:
  deploy:

    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # IMPORTANT: mandatory for trusted publishing

    steps:
    - uses: actions/checkout@v7
    - name: Set up uv
      uses: astral-sh/setup-uv@v10.3.0
      with:
        python-version: "3.12"
    - name: Build package
      run: uv build
    - name: Publish to pypi
      run: uv publish --trusted-publishing always
